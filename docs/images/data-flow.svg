<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DutyGrid 資料流程與資料表關係</title><desc id="desc">勤務計畫、點位、路線、人員、配置、裝備、匯入紀錄與工作區狀態在 SQLite 的主要關係。</desc>
  <style>text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#14213d}.title{font-size:28px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.s{font-size:13px}.box{stroke:#284b63;stroke-width:2;rx:12}.arrow{stroke:#284b63;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#284b63"/></marker></defs>
  <rect width="1200" height="720" fill="#f7fbff"/><text x="600" y="45" text-anchor="middle" class="title">SQLite 資料流程與主要關係</text>
  <rect x="470" y="85" width="260" height="115" class="box" fill="#dceeff"/><text x="600" y="125" text-anchor="middle" class="h">duty_plans</text><text x="600" y="153" text-anchor="middle" class="b">計畫、模式、底圖路徑</text><text x="600" y="178" text-anchor="middle" class="s">所有計畫內資料的主體</text>
  <rect x="80" y="275" width="230" height="120" class="box" fill="#e4f7e8"/><text x="195" y="315" text-anchor="middle" class="h">duty_points</text><text x="195" y="343" text-anchor="middle" class="b">座標、顏色、類型</text><text x="195" y="369" text-anchor="middle" class="s">計畫刪除時級聯</text>
  <rect x="405" y="275" width="230" height="120" class="box" fill="#fff0c9"/><text x="520" y="315" text-anchor="middle" class="h">duty_routes</text><text x="520" y="343" text-anchor="middle" class="b">路線或手繪幾何</text><text x="520" y="369" text-anchor="middle" class="s">duty_route_stops 排定點位</text>
  <rect x="890" y="275" width="230" height="120" class="box" fill="#f3e6ff"/><text x="1005" y="315" text-anchor="middle" class="h">workspace_states</text><text x="1005" y="343" text-anchor="middle" class="b">頁面與選取暫存</text><text x="1005" y="369" text-anchor="middle" class="s">啟動時目前會清除</text>
  <rect x="80" y="510" width="230" height="120" class="box" fill="#ffe6e6"/><text x="195" y="550" text-anchor="middle" class="h">deployment_equipment</text><text x="195" y="578" text-anchor="middle" class="b">計畫＋點位裝備 JSON</text><text x="195" y="604" text-anchor="middle" class="s">點位刪除時級聯</text>
  <rect x="405" y="510" width="230" height="120" class="box" fill="#e6f5f1"/><text x="520" y="550" text-anchor="middle" class="h">personnel_assignments</text><text x="520" y="578" text-anchor="middle" class="b">計畫＋人員＋可空點位</text><text x="520" y="604" text-anchor="middle" class="s">同人可配置不同點位</text>
  <rect x="760" y="510" width="360" height="120" class="box" fill="#e6f5f1"/><text x="940" y="550" text-anchor="middle" class="h">personnel 與匯入紀錄</text><text x="940" y="576" text-anchor="middle" class="s">personnel、import_batches</text><text x="940" y="596" text-anchor="middle" class="s">personnel_import_errors；拒絕列仍記錄</text><text x="940" y="616" text-anchor="middle" class="s">員編與無線電代號唯一</text>
  <path d="M515 200L250 265M560 200L540 265M680 200L960 265M195 395V500M310 335H395M520 395V500M635 570H750" class="arrow"/>
  <text x="600" y="680" text-anchor="middle" class="s">常用路線、schema_migrations 為獨立全域資料表，未在圖中展開。</text>
</svg>
