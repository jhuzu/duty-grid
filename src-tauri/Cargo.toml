[package]
name = "dutygrid"
version = "0.1.0"
description = "Duty deployment planning workspace"
authors = ["DutyGrid"]
edition = "2021"

[lib]
name = "dutygrid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
